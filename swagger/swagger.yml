swagger: '2.0'
info:
  title: diplomas_mid
  description: API MID para gestión, generación y firma de diplomas digitales de la
    Universidad Distrital Francisco José de Caldas. Las respuestas JSON se entregan
    directamente, sin sobre de respuesta.
  version: 1.0.0
basePath: /v1
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: 'Ingresar el valor completo: Bearer <token>. Se propaga a los servicios
      consumidos.'
security:
- Bearer: []
paths:
  /documento_digital/{id}/diploma/preview:
    get:
      tags:
      - documento_digital
      summary: Generar
      operationId: DiplomaPreviewController_Generar
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        format: int64
        description: Identificador del recurso.
      responses:
        '200':
          description: Operación exitosa.
          schema:
            $ref: '#/definitions/DiplomaPreviewResult'
        '400':
          description: Entrada inválida.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Sin rol activo o sin permisos.
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Estado incompatible con la operación.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Error interno.
          schema:
            $ref: '#/definitions/Error'
        '502':
          description: Error de un servicio externo.
          schema:
            $ref: '#/definitions/Error'
        '504':
          description: Tiempo de espera agotado en un servicio externo.
          schema:
            $ref: '#/definitions/Error'
    post:
      tags:
      - documento_digital
      summary: Preparar
      operationId: DiplomaPreviewController_Preparar
      parameters:
      - name: id
        in: path
        required: true
        type: integer
        format: int64
        description: Identificador del recurso.
      - name: body
        in: body
        required: true
        schema:
          type: object
          properties:
            documento_identidad_secretario:
              type: integer
              format: int64
      responses:
        '200':
          description: Operación exitosa.
          schema:
            $ref: '#/definitions/DiplomaPreviewResult'
        '400':
          description: Entrada inválida.
          schema:
            $ref: '#/definitions/Error'
        '403':
          description: Sin rol activo o sin permisos.
          schema:
            $ref: '#/definitions/Error'
        '409':
          description: Estado incompatible con la operación.
          schema:
            $ref: '#/definitions/Error'
        '500':
          description: Error interno.
          schema:
            $ref: '#/definitions/Error'
        '502':
          description: Error de un servicio externo.
          schema:
            $ref: '#/definitions/Error'
        '504':
          description: Tiempo de espera agotado en un servicio externo.

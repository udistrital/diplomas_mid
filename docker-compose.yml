services:
  diplomas_mid:
    container_name: diplomas-mid-local
    build:
      context: .
    environment:
      DIPLOMAS_MID_RUNMODE: ${DIPLOMAS_MID_RUNMODE:-prod}
      PARAMETER_STORE: ${PARAMETER_STORE:-}
      ACADEMICA_PRUEBAS_API_URL: ${ACADEMICA_PRUEBAS_API_URL:-}
      HOMOLOGACION_DEPENDENCIAS_API_URL: ${HOMOLOGACION_DEPENDENCIAS_API_URL:-}
      DIPLOMAS_MID_HTTP_PORT: ${DIPLOMAS_MID_HTTP_PORT:-8090}
      FIRMA_ELECTRONICA_MID_URL: ${FIRMA_ELECTRONICA_MID_URL}
      DIPLOMAS_CRUD_URL: ${DIPLOMAS_CRUD_URL}
      ADMINISTRATIVA_AMAZON_API_URL: ${ADMINISTRATIVA_AMAZON_API_URL}
      DOCUMENTOS_CRUD_URL: ${DOCUMENTOS_CRUD_URL}
      GESTOR_DOCUMENTAL_URL: ${GESTOR_DOCUMENTAL_URL}
      PAZ_Y_SALVOS_MID_URL: ${PAZ_Y_SALVOS_MID_URL}
      ACADEMICA_CORE_SERVICE_URL: ${ACADEMICA_CORE_SERVICE_URL}
      OIKOS_API_URL: ${OIKOS_API_URL}
      PARAMETROS_CRUD_URL: ${PARAMETROS_CRUD_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DIPLOMAS_S3_BUCKET: ${DIPLOMAS_S3_BUCKET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DIPLOMAS_MID_HTTP_PORT:-8090}:${DIPLOMAS_MID_HTTP_PORT:-8090}"
